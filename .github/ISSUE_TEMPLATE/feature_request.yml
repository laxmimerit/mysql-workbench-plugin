name: Feature request
description: An idea for the notebook, results, AI or the workspace
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: The plugin is for MySQL and MySQL Workbench 26 only.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task, and what makes it hard today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Anything else
      description: Other tools that do this well, screenshots, sketches.
