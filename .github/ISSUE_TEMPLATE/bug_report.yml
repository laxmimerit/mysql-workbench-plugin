name: Bug report
description: Something in the plugin does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste passwords, API keys or private data.
        For a security problem, use the Security tab instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a notebook on a MySQL 8.4 server
        2. Run `SELECT ...`
        3. Click ...
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Plugin version
      description: Settings > Apps > Workbench (KGP) shows it.
      placeholder: "10.0"
    validations:
      required: true
  - type: input
    id: workbench
    attributes:
      label: MySQL Workbench version
      description: Help > About in Workbench.
      placeholder: "26.10.0"
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: MySQL server version
      placeholder: "9.4.0"
  - type: dropdown
    id: os
    attributes:
      label: Windows
      options: [Windows 11, Windows 10]
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log and screenshots
      description: The contents of %TEMP%\workbench-kgp.log if it exists, and screenshots if they help.
